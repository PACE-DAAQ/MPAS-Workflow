suite: ForecastFromExternalAnalyses

externalanalyses:
  resource: "GFS.PANDAC"
  resources:
    GFS:
      PANDAC:
        60km:
          directory: /glade/campaign/ncar/nmmm0081/Data/MPAS-Workflow/pandac/60kmMeshGFS/MPAS_IC

experiment:
  name: 'ForecastFromPrestagedIC_GFS_20241014_24HR_NOAH_PRM'

extendedforecast:
  meanTimes: T00
  lengthHR: 24
  outIntervalHR: 12
  #execute: False # uncomment if forecasts are already completed
  # optionally turn on extended forecast post
  post: []

hpc:
  CriticalAccount: NMMM0063
  CriticalQueue: main
  NonCriticalAccount: NMMM0063
  NonCriticalQueue: main
  NonCriticalPriority: premium
  SingleProcAccount: NMMM0063
  SingleProcQueue: develop

members:
  n: 1

build:
  mpas bundle: /glade/campaign/ncar/nmmm0081/Src/mpas-bundle/build
  bundle compiler used: gnu-openmpi
  gocart emission directory: /glade/campaign/ncar/nmmm0081/Data/MPAS-Workflow/gocart2g/emission/all

model:
  outerMesh: 60km
  innerMesh: 60km
  ensembleMesh: 60km
  # scenario-wide fallback for any member beyond the 'member variants' list
  streams variant: cntl
  do bburn prm: true   # enable biomass-burning plume rise for this forecast (config_do_bburnPRM)

observations: # for optional verification
  resource: PANDACArchive

workflow:
  first cycle point: 20241014T00
  final cycle point: 20241014T00
  max active cycle points: 1
