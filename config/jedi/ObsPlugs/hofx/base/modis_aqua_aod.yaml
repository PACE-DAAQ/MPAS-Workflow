- obs space:
    <<: *ObsSpace
    name: AodCRTM
    obsdatain:
      engine:
        type: H5File
        obsfile: {{InDBDir}}/modis_aqua_aod_obs_{{thisValidDate}}.h5
        missing file action: warn
    obsdataout:
      engine:
        type: H5File
        obsfile: {{OutDBDir}}/{{obsPrefix}}_modis_aqua_aod.h5
    simulated variables: [aerosolOpticalDepth]
    channels: &aodChannels {{aodChannel}}
  obs error: *ObsErrorDiagonal
  obs operator:
    name: AodCRTM
    Absorbers: [H2O, O3]
    obs options:
      Sensor_ID: v.modis_aqua
      EndianType: little_endian
      CoefficientPath: {{CRTMTABLES}}
      AerosolCoeff_File: AerosolCoeff.GOCART-GEOS5.nc4
      Aerosol_Model: GOCART-GEOS5
      AerosolCoeff_Format: netCDF
      AerosolOption: {{aodAerosolOption}}
      SpcCoeff_Format: binary
      TauCoeff_Format: binary
      model units coeff: 1e9
