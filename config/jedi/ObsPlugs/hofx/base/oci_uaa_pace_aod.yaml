- obs space:
    <<: *ObsSpace
    name: AodCRTM
    obsdatain:
      engine:
        type: H5File
        obsfile: {{InDBDir}}/oci_uaa_pace_aod_obs_{{thisValidDate}}.h5
        missing file action: warn
    obsdataout:
      engine:
        type: H5File
        obsfile: {{OutDBDir}}/{{obsPrefix}}_oci_uaa_pace_aod.h5
    simulated variables: [aerosolOpticalDepth]
    channels: 1,2,3,4,5,6,7,8
  obs error: *ObsErrorDiagonal
  obs operator:
    name: AodCRTM
    Absorbers: [H2O, O3]
    obs options:
      Sensor_ID: v.oci_uaa
      EndianType: little_endian
      CoefficientPath: {{CRTMTABLES}}
      AerosolCoeff_File: AerosolCoeff.GOCART-GEOS5.nc4
      Aerosol_Model: GOCART-GEOS5
      AerosolCoeff_Format: netCDF
      AerosolOption: {{aodAerosolOption}}
      SpcCoeff_Format: netCDF
      TauCoeff_Format: netCDF
      model units coeff: 1e9
