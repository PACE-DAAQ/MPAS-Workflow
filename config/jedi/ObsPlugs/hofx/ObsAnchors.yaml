_obs space: &ObsSpace
  obs perturbations seed: 1
  io pool:
    max pool size: {{maxIODAPoolSize}}
  distribution:
    name: RoundRobin
_obs error diagonal: &ObsErrorDiagonal
  covariance model: diagonal
_clear crtm: &clearCRTMObsOperator
  name: CRTM
  SurfaceWindGeoVars: uv
  Absorbers: [H2O, O3]
  obs options: &CRTMObsOptions
    EndianType: little_endian
    CoefficientPath: {{CRTMTABLES}}
    IRVISlandCoeff: {{IRVISlandCoeff}}
_cloudy crtm: &cloudyCRTMObsOperator
  name: CRTM
  SurfaceWindGeoVars: uv
  Absorbers: [H2O, O3]
  Clouds: [Water, Ice, Rain, Snow, Graupel]
  Cloud_Seeding: false
  obs options:
    <<: *CRTMObsOptions
_multi iteration filter: &multiIterationFilter
  _blank: null
# Anchors referenced by config/jedi/ObsPlugs/da plugs, which HofX falls back to
# (bin/PrepJEDI.csh). Keep in sync with variational/ObsAnchors.yaml.
_conventional obs localizations: &heightAndHorizObsLoc
  _blank: null
_nonconventional obs localizations: &horizObsLoc
  _blank: null
_aod crtm: &aodCRTMObsOperator
  name: AodCRTM
  Absorbers: [H2O, O3]
  obs options: &AODCRTMObsOptions
    EndianType: little_endian
    CoefficientPath: {{CRTMTABLES}}
    AerosolCoeff_File: AerosolCoeff.GOCART-GEOS5.nc4
    Aerosol_Model: GOCART-GEOS5
    AerosolCoeff_Format: netCDF
    AerosolOption: {{aodAerosolOption}}
    SpcCoeff_Format: netCDF
    TauCoeff_Format: netCDF
    model units coeff: 1e9
_aod crtm binary: &aodCRTMObsOperator_binary
  name: AodCRTM
  Absorbers: [H2O, O3]
  obs options: &AODCRTMObsOptions_binary
    EndianType: little_endian
    CoefficientPath: {{CRTMTABLES}}
    AerosolCoeff_File: AerosolCoeff.GOCART-GEOS5.nc4
    Aerosol_Model: GOCART-GEOS5
    AerosolCoeff_Format: netCDF
    AerosolOption: {{aodAerosolOption}}
    SpcCoeff_Format: binary
    TauCoeff_Format: binary
    model units coeff: 1e9
