  obs filters:
  - filter: PreQC
    maxvalue: 1
  - filter: Domain Check
    where:
    - variable:
        name: latitude@MetaData
      minvalue: -70
      maxvalue: 70
  - filter: Bounds Check
    filter variables:
    - name: aerosolOpticalDepth
      channels: *aodChannels
    minvalue: 0
    maxvalue: 4.9
    action:
      name: reject
  # observation error: sigma = max(0.05, 0.02 + 0.3*AOD), i.e. the Deep Blue pixel-level uncertainty slope
  # with a 0.05 floor (consistent with the OCI/polarimeter floor); then a 4-sigma gross-error check
  - filter: Perform Action
    filter variables:
    - name: aerosolOpticalDepth
      channels: *aodChannels
    action:
      name: assign error
      error function:
        name: ObsFunction/ObsErrorModelRamp
        options:
          xvar:
            name: ObsValue/aerosolOpticalDepth
            channels: *aodChannels
          x0: [0.1]
          x1: [1.0]
          err0: [0.05]
          err1: [0.32]
  - filter: Gaussian Thinning
    horizontal_mesh: {{RADTHINDISTANCE}}
    select_mean: true
    action:
      name: reduce obs space
  # superobbing (select_mean) can leave missing values in the reduced obs space;
  # flag them before any Background Check, whose applyFilter asserts on missing obs.
  - filter: Bounds Check
    filter variables:
    - name: aerosolOpticalDepth
      channels: 4
    minvalue: 0
    maxvalue: 4.9
    action:
      name: reject
  - filter: Background Check
    filter variables:
    - name: aerosolOpticalDepth
      channels: *aodChannels
    threshold: 4.0
    action:
      name: reject
#  - filter: RejectList
#    defer to post: true
#    filter variables:
#    - name: aerosolOpticalDepth
#      channels: *aodChannels
  # 3-sigma background check: inflate the obs error x3 where |O-B| > 3 sigma
  - filter: Background Check
    filter variables:
    - name: aerosolOpticalDepth
      channels: *aodChannels
    threshold: 3.0
    action:
      name: inflate error
      inflation factor: 3.0
