  obs filters:
  - filter: PreQC
    maxvalue: 1
  - filter: Domain Check
    where:
    - variable:
        name: latitude@MetaData
      minvalue: -60
      maxvalue: 70
  - filter: Bounds Check
    filter variables:
    - name: aerosolOpticalDepth
      channels: 1-9
    minvalue: 0
    maxvalue: 4.9
    action:
      name: reject
  # MULTI-WAVELENGTH ROUND TWO (2026-09-28): ObsValue ch1 (354) and ch4 (550) are bias-corrected over LAND in the
  # IODA file (docs/oci_bias_fit_channels.md); ch6 (870) untouched (no land retrievals; island-site ocean fit not applied).
  # Observation error = robust OCI-AERONET scatter per channel, floors 0.04/0.03/0.02 (354/550/870):
  #   land : 354: 0.036+0.26*AOD   550: 0.02+0.53*AOD   870: n/a (no land obs; 550 ramp reused)
  #   ocean: 354: 0.30*AOD (floor 0.03)   550: 0.01+0.26*AOD (floor 0.03)   870: 0.0045+0.21*AOD (floor 0.02)
  - filter: Perform Action
    filter variables:
    - name: aerosolOpticalDepth
      channels: 1,4,6
    where:
    - variable:
        name: MetaData/surfaceQualifier
      is_in: 1
    action:
      name: assign error
      error function:
        name: ObsFunction/ObsErrorModelRamp
        channels: 1,4,6
        options:
          channels: 1,4,6
          xvar:
            name: ObsValue/aerosolOpticalDepth
            channels: 1,4,6
          x0: [0.02, 0.02, 0.02]
          x1: [3.0, 3.0, 3.0]
          err0: [0.04, 0.03, 0.03]
          err1: [0.81, 1.61, 1.61]
  - filter: Perform Action
    filter variables:
    - name: aerosolOpticalDepth
      channels: 1,4,6
    where:
    - variable:
        name: MetaData/surfaceQualifier
      is_in: 0
    action:
      name: assign error
      error function:
        name: ObsFunction/ObsErrorModelRamp
        channels: 1,4,6
        options:
          channels: 1,4,6
          xvar:
            name: ObsValue/aerosolOpticalDepth
            channels: 1,4,6
          x0: [0.10, 0.08, 0.08]
          x1: [3.0, 3.0, 3.0]
          err0: [0.03, 0.03, 0.02]
          err1: [0.89, 0.79, 0.63]
  - filter: Gaussian Thinning
    horizontal_mesh: {{RADTHINDISTANCE}}
    # select_mean (superobbing) OFF: it rejected 100% of superobs, 0 obs assimilated (2026-09-28)
    action:
      name: reduce obs space
  # superobbing (select_mean) can leave missing values in the reduced obs space;
  # flag them before any Background Check, whose applyFilter asserts on missing obs.
  - filter: Bounds Check
    filter variables:
    - name: aerosolOpticalDepth
      channels: 1,4,6
    minvalue: 0
    maxvalue: 4.9
    action:
      name: reject
  # gross-error check against the assigned error, before any inflation
  - filter: Background Check
    filter variables:
    - name: aerosolOpticalDepth
      channels: 1,4,6
    threshold: 4.0
    action:
      name: reject
  # 3-sigma background check: inflate the obs error x3 where |O-B| > 3 sigma
  - filter: Background Check
    filter variables:
    - name: aerosolOpticalDepth
      channels: 1,4,6
    threshold: 3.0
    action:
      name: inflate error
      inflation factor: 3.0
  # Multi-wavelength: 354 (ch1), 550 (ch4) and 870 nm (ch6) contribute to the analysis; the others are monitored.
  - filter: Perform Action
    filter variables:
    - name: aerosolOpticalDepth
      channels: 2,3,5,7,8,9
    action:
      name: passivate
