  obs filters:
  - filter: PreQC
    maxvalue: 1
  - filter: Domain Check
    where:
    - variable:
        name: latitude@MetaData
      minvalue: -60
      maxvalue: 70
  - filter: Bounds Check
    filter variables:
    - name: aerosolOpticalDepth
      channels: 1-9
    minvalue: 0
    maxvalue: 4.9
    action:
      name: reject
  # ROUND TWO (2026-09-28): ObsValue ch4 is already bias-corrected in the IODA file
  #   land : corrected = OCI - (-0.0298 + 0.5572*OCI);  ocean: corrected = OCI - (+0.0154 + 0.3510*OCI)
  #   from 358k land / 55k ocean OCI-AERONET(550 via Angstrom) pairs, Jul 21 - Sep 15 2024 (docs/oci_bias_fit_fullperiod.md).
  # Observation error = robust OCI-AERONET scatter after bias removal, expressed in corrected AOD, floor 0.03:
  #   land : sigma = max(0.03, 0.02 + 0.53*AOD)   ocean: sigma = max(0.03, 0.01 + 0.26*AOD)
  - filter: Perform Action
    filter variables:
    - name: aerosolOpticalDepth
      channels: 4
    where:
    - variable:
        name: MetaData/surfaceQualifier
      is_in: 1
    action:
      name: assign error
      error function:
        name: ObsFunction/ObsErrorModelRamp
        options:
          xvar:
            name: ObsValue/aerosolOpticalDepth
            channels: 4
          x0: [0.02]
          x1: [3.0]
          err0: [0.03]
          err1: [1.61]
  - filter: Perform Action
    filter variables:
    - name: aerosolOpticalDepth
      channels: 4
    where:
    - variable:
        name: MetaData/surfaceQualifier
      is_in: 0
    action:
      name: assign error
      error function:
        name: ObsFunction/ObsErrorModelRamp
        options:
          xvar:
            name: ObsValue/aerosolOpticalDepth
            channels: 4
          x0: [0.08]
          x1: [3.0]
          err0: [0.03]
          err1: [0.79]
  - filter: Gaussian Thinning
    horizontal_mesh: {{RADTHINDISTANCE}}
    # select_mean (superobbing) OFF: it rejected 100% of superobs, 0 obs assimilated (2026-09-28)
    action:
      name: reduce obs space
  # superobbing (select_mean) can leave missing values in the reduced obs space;
  # flag them before any Background Check, whose applyFilter asserts on missing obs.
  - filter: Bounds Check
    filter variables:
    - name: aerosolOpticalDepth
      channels: 4
    minvalue: 0
    maxvalue: 4.9
    action:
      name: reject
  # gross-error check against the assigned error, before any inflation
  - filter: Background Check
    filter variables:
    - name: aerosolOpticalDepth
      channels: 4
    threshold: 4.0
    action:
      name: reject
  # 3-sigma background check: inflate the obs error x3 where |O-B| > 3 sigma
  - filter: Background Check
    filter variables:
    - name: aerosolOpticalDepth
      channels: 4
    threshold: 3.0
    action:
      name: inflate error
      inflation factor: 3.0
  # Only 550 nm contributes to the analysis; retain other channels for monitoring.
  - filter: Perform Action
    filter variables:
    - name: aerosolOpticalDepth
      channels: 1-3,5-9
    action:
      name: passivate
