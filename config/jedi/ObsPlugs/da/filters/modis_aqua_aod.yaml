  obs filters:
  - filter: PreQC
    maxvalue: 1
  - filter: Domain Check
    where:
    - variable:
        name: latitude@MetaData
      minvalue: -60
      maxvalue: 60
  - filter: Bounds Check
    filter variables:
    - name: aerosolOpticalDepth
      channels: *aodChannels
    minvalue: 0
    maxvalue: 4.9
    action:
      name: reject
  - filter: Gaussian Thinning
    horizontal_mesh: {{RADTHINDISTANCE}}
#    select_mean: true
    action:
      name: reduce obs space
#  - filter: RejectList
#    defer to post: true
#    filter variables:
#    - name: aerosolOpticalDepth
#      channels: *aodChannels
  # 3-sigma background check: inflate the obs error x3 where |O-B| > 3 sigma
  - filter: Background Check
    filter variables:
    - name: aerosolOpticalDepth
      channels: *aodChannels
    threshold: 3.0
    action:
      name: inflate error
      inflation factor: 3.0
