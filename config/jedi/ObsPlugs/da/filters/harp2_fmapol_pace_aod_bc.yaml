  obs filters:
  - filter: PreQC
    maxvalue: 1
  - filter: Domain Check
    where:
    - variable:
        name: latitude@MetaData
      minvalue: -60
      maxvalue: 70
  - filter: Bounds Check
    filter variables:
    - name: aerosolOpticalDepth
      channels: 1,2,3,4
    minvalue: 0
    maxvalue: 4.9
    action:
      name: reject
  # observation error for the 550-nm channel: sigma = 0.045 + 0.2*AOD, floored at 0.05 (same scale as the OCI
  # product error); the file's retrieval uncertainty (~0.008) ignores representativeness on the 60-km mesh.
  # ROUND TWO (2026-09-28): ch2 (549 nm) bias-corrected over LAND in the IODA copy: corrected = HARP2 - (0.0234 + 0.5909*HARP2)
  #   (238k HARP2-AERONET land pairs, Jul 21-Sep 15; docs/polarimeter_bias_fit_fullperiod.md). Ocean untouched (HARP2 agrees with
  #   MODIS over open ocean). surfaceQualifier in the copy is repaired from the model land mask (converter wrote 0 everywhere).
  # Observation error from the residual scatter, floor 0.03: land sigma = 0.02 + 0.56*AOD ; ocean sigma = 0.01 + 0.28*AOD
  - filter: Perform Action
    filter variables:
    - name: aerosolOpticalDepth
      channels: 2
    where:
    - variable:
        name: MetaData/surfaceQualifier
      is_in: 1
    action:
      name: assign error
      error function:
        name: ObsFunction/ObsErrorModelRamp
        options:
          xvar:
            name: ObsValue/aerosolOpticalDepth
            channels: 2
          x0: [0.02]
          x1: [3.0]
          err0: [0.03]
          err1: [1.70]
  - filter: Perform Action
    filter variables:
    - name: aerosolOpticalDepth
      channels: 2
    where:
    - variable:
        name: MetaData/surfaceQualifier
      is_in: 0
    action:
      name: assign error
      error function:
        name: ObsFunction/ObsErrorModelRamp
        options:
          xvar:
            name: ObsValue/aerosolOpticalDepth
            channels: 2
          x0: [0.07]
          x1: [3.0]
          err0: [0.03]
          err1: [0.85]
  - filter: Gaussian Thinning
    horizontal_mesh: {{RADTHINDISTANCE}}
    # select_mean (superobbing) OFF: it rejected 100% of superobs, 0 obs assimilated (2026-09-28)
    action:
      name: reduce obs space
  # superobbing (select_mean) can leave missing values in the reduced obs space;
  # flag them before any Background Check, whose applyFilter asserts on missing obs.
  - filter: Bounds Check
    filter variables:
    - name: aerosolOpticalDepth
      channels: 2
    minvalue: 0
    maxvalue: 4.9
    action:
      name: reject
  - filter: Background Check
    filter variables:
    - name: aerosolOpticalDepth
      channels: 2
    threshold: 4.0
    action:
      name: reject
  # gross-error check on the assigned error
  # 3-sigma background check: inflate the obs error x3 where |O-B| > 3 sigma
  - filter: Background Check
    filter variables:
    - name: aerosolOpticalDepth
      channels: 2
    threshold: 3.0
    action:
      name: inflate error
      inflation factor: 3.0
#  - filter: RejectList
#    defer to post: true
#    filter variables:
#    - name: aerosolOpticalDepth
#      channels: 1-4
  - filter: Perform Action
    filter variables:
    - name: aerosolOpticalDepth
      channels: 1,3,4   # keep ch2 (550 nm) active; 440/670/870 nm monitored
    action:
      name: passivate

