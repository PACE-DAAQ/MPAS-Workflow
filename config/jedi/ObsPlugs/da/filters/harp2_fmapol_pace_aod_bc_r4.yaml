# Round four polar_new: HARP2 549 nm assimilated RAW, with a retuned per-surface observation
# error. The shared polarimeter ramp understated the land error by about a factor two and
# could not represent the different land and ocean shapes.
  obs filters:
  - filter: PreQC
    maxvalue: 0
  - filter: Domain Check
    where:
    - variable:
        name: latitude@MetaData
      minvalue: -70
      maxvalue: 70
  - filter: Bounds Check
    filter variables:
    - name: aerosolOpticalDepth
      channels: 1,2,3,4
    minvalue: 0
    maxvalue: 4.9
    action:
      name: reject
  # observation error for the 550-nm channel: sigma = 0.045 + 0.2*AOD, floored at 0.05 (same scale as the OCI
  # product error); the file's retrieval uncertainty (~0.008) ignores representativeness on the 60-km mesh.
  # land: residual error after the AERONET Level 2.0 bias correction (PreQC = 0 fit), with
  # 0.03 representativeness added in quadrature. Measured 2026-10-09.
  - filter: Perform Action
    filter variables:
    - name: aerosolOpticalDepth
      channels: 2
    where:
    - variable:
        name: MetaData/surfaceQualifier
      is_in: 1
    action:
      name: assign error
      error function:
        name: ObsFunction/ObsErrorModelStepwiseLinear
        options:
          xvar:
            name: ObsValue/aerosolOpticalDepth
            channels: 2
          xvals: [0.0, 0.0376, 0.0783, 0.126, 0.1699, 0.2341, 0.3433, 0.4767, 0.6873, 0.9071, 4.9]
          errors: [0.042, 0.042, 0.047, 0.062, 0.083, 0.111, 0.165, 0.207, 0.395, 0.458, 0.458]
  # ocean: residual error after the AERONET Level 2.0 bias correction (PreQC = 0 fit), with
  # 0.03 representativeness added in quadrature. Measured 2026-10-09.
  - filter: Perform Action
    filter variables:
    - name: aerosolOpticalDepth
      channels: 2
    where:
    - variable:
        name: MetaData/surfaceQualifier
      is_in: 0
    action:
      name: assign error
      error function:
        name: ObsFunction/ObsErrorModelStepwiseLinear
        options:
          xvar:
            name: ObsValue/aerosolOpticalDepth
            channels: 2
          xvals: [0.0, 0.0908, 0.1297, 0.1669, 0.2419, 0.3441, 0.4526, 4.9]
          errors: [0.053, 0.053, 0.053, 0.055, 0.076, 0.189, 0.23, 0.23]
  - filter: Gaussian Thinning
    horizontal_mesh: 20.0
    # select_mean (superobbing) stays OFF: it rejected 100% of superobs (2026-09-28; HARP2/SPEXone r4 first cycle: all QC-rejected)
    action:
      name: reduce obs space
  # superobbing (select_mean) can leave missing values in the reduced obs space;
  # flag them before any Background Check, whose applyFilter asserts on missing obs.
  - filter: Bounds Check
    filter variables:
    - name: aerosolOpticalDepth
      channels: 2
    minvalue: 0
    maxvalue: 4.9
    action:
      name: reject
  - filter: Background Check
    filter variables:
    - name: aerosolOpticalDepth
      channels: 2
    threshold: 8.0
    action:
      name: reject
  # gross-error check on the assigned error
  # loose background checks as for r4 OCI: reject beyond 8 sigma, inflate x2 beyond 5 sigma (thick smoke keeps its weight)
  - filter: Background Check
    filter variables:
    - name: aerosolOpticalDepth
      channels: 2
    threshold: 5.0
    action:
      name: inflate error
      inflation factor: 2.0
#  - filter: RejectList
#    defer to post: true
#    filter variables:
#    - name: aerosolOpticalDepth
#      channels: 1-4
  - filter: Perform Action
    filter variables:
    - name: aerosolOpticalDepth
      channels: 1,3,4   # keep ch2 (550 nm) active; 440/670/870 nm monitored
    action:
      name: passivate

