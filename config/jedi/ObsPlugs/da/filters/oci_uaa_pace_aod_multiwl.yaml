  obs filters:
  - filter: PreQC
    maxvalue: 1
  - filter: Domain Check
    where:
    - variable:
        name: latitude@MetaData
      minvalue: -60
      maxvalue: 60
  - filter: Bounds Check
    filter variables:
    - name: aerosolOpticalDepth
      channels: 1-9
    minvalue: 0
    maxvalue: 4.9
    action:
      name: reject
#  - filter: Background Check
#    channels: 4
#    threshold: 3.0
#    action:
#      name: inflate error
#      inflation factor: 3.0
  - filter: Gaussian Thinning
    horizontal_mesh: {{RADTHINDISTANCE}}
    #select_mean: true
    action:
      name: reduce obs space
  # Multi-wavelength: 354 (ch1), 550 (ch4) and 870 nm (ch6) contribute to the analysis; the others are monitored.
  - filter: Perform Action
    filter variables:
    - name: aerosolOpticalDepth
      channels: 2,3,5,7,8,9
    action:
      name: passivate
