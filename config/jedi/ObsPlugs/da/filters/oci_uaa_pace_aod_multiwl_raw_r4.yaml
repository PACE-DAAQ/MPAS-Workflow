  obs filters:
  - filter: PreQC
    maxvalue: 1
  - filter: Domain Check
    where:
    - variable:
        name: latitude@MetaData
      minvalue: -70
      maxvalue: 70
  - filter: Bounds Check
    filter variables:
    - name: aerosolOpticalDepth
      channels: 1-9
    minvalue: 0
    maxvalue: 4.9
    action:
      name: reject
  # ROUND FOUR (2026-10-04): RAW OCI 354/550/870 nm, no bias correction (ocean never corrected; land correction dropped).
  # Observation error is assigned on the raw AOD, from OCI-minus-AERONET RMS per surface type
  # (oci_bc_scores.csv, 'none' candidate binned on the OCI value, whole period 21 Jul - 15 Sep 2024).
  # It is capped FLAT at 0.45 above AOD 0.8 (land) / 1.17 (ocean) so thick smoke is not down-weighted.
  # surfaceQualifier: 1 = land, 0 = ocean.
  - filter: Perform Action
    filter variables:
    - name: aerosolOpticalDepth
      channels: 1,6
    where:
    - variable:
        name: MetaData/surfaceQualifier
      is_in: 1
    action:
      name: assign error
      error function:
        name: ObsFunction/ObsErrorModelRamp
        channels: 1,6
        options:
          channels: 1,6
          xvar:
            name: ObsValue/aerosolOpticalDepth
            channels: 1,6
          x0: [0.02, 0.02]
          x1: [1.607, 0.812]
          err0: [0.04, 0.03]
          err1: [0.45, 0.45]
  - filter: Perform Action
    filter variables:
    - name: aerosolOpticalDepth
      channels: 1,6
    where:
    - variable:
        name: MetaData/surfaceQualifier
      is_in: 0
    action:
      name: assign error
      error function:
        name: ObsFunction/ObsErrorModelRamp
        channels: 1,6
        options:
          channels: 1,6
          xvar:
            name: ObsValue/aerosolOpticalDepth
            channels: 1,6
          x0: [0.1, 0.08]
          x1: [1.516, 2.138]
          err0: [0.03, 0.02]
          err1: [0.45, 0.45]
  - filter: Perform Action
    filter variables:
    - name: aerosolOpticalDepth
      channels: 4
    where:
    - variable:
        name: MetaData/surfaceQualifier
      is_in: 1
    action:
      name: assign error
      error function:
        name: ObsFunction/ObsErrorModelStepwiseLinear
        options:
          xvar:
            name: ObsValue/aerosolOpticalDepth
            channels: 4
          xvals: [0.0, 0.05, 0.15, 0.3, 0.5, 0.7, 0.8, 4.9]
          errors: [0.03, 0.045, 0.073, 0.138, 0.24, 0.35, 0.45, 0.45]
  - filter: Perform Action
    filter variables:
    - name: aerosolOpticalDepth
      channels: 4
    where:
    - variable:
        name: MetaData/surfaceQualifier
      is_in: 0
    action:
      name: assign error
      error function:
        name: ObsFunction/ObsErrorModelStepwiseLinear
        options:
          xvar:
            name: ObsValue/aerosolOpticalDepth
            channels: 4
          xvals: [0.0, 0.0467, 0.0781, 0.1407, 0.2393, 0.3608, 0.5149, 0.6823, 0.8755, 1.172, 4.9]
          errors: [0.02, 0.0208, 0.02, 0.0387, 0.0806, 0.1223, 0.1586, 0.2119, 0.3204, 0.45, 0.45]
  - filter: Gaussian Thinning
    horizontal_mesh: {{RADTHINDISTANCE}}
    # select_mean (superobbing) stays OFF: it rejected 100% of superobs (2026-09-28)
    action:
      name: reduce obs space
  - filter: Bounds Check
    filter variables:
    - name: aerosolOpticalDepth
      channels: 1,4,6
    minvalue: 0
    maxvalue: 4.9
    action:
      name: reject
  # LOOSER background check (round three: reject 4 sigma, inflate x3 at 3 sigma, which down-weights thick smoke
  # whenever the background is low). Now: reject only at 8 sigma, inflate x2 only beyond 5 sigma.
  - filter: Background Check
    filter variables:
    - name: aerosolOpticalDepth
      channels: 1,4,6
    threshold: 8.0
    action:
      name: reject
  - filter: Background Check
    filter variables:
    - name: aerosolOpticalDepth
      channels: 1,4,6
    threshold: 5.0
    action:
      name: inflate error
      inflation factor: 2.0
  - filter: Perform Action
    filter variables:
    - name: aerosolOpticalDepth
      channels: 2,3,5,7,8,9
    action:
      name: passivate
