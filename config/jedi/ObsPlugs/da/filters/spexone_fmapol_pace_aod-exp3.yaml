  obs filters:
  - filter: PreQC
    maxvalue: 1
  - filter: Domain Check
    where:
    - variable:
        name: latitude@MetaData
      minvalue: -60
      maxvalue: 60
  - filter: Bounds Check
    filter variables:
    - name: aerosolOpticalDepth
      channels: 7,22,32
    minvalue: 0
    maxvalue: 4.9
    action:
      name: reject
  - filter: Background Check
    channels: 22
    threshold: 3.0
    action:
      name: inflate error
      inflation factor: 3.0
  - filter: Gaussian Thinning
    horizontal_mesh: {{RADTHINDISTANCE}}
#    select_mean: true
    action:
      name: reduce obs space
#  - filter: RejectList
#    defer to post: true
#    filter variables:
#    - name: aerosolOpticalDepth
#      channels: 1-34
  - filter: Perform Action
    filter variables:
    - name: aerosolOpticalDepth
      channels: 7,32
    action:
      name: passivate

