  obs filters:
  - filter: PreQC
    maxvalue: 1
  - filter: Domain Check
    where:
    - variable:
        name: latitude@MetaData
      minvalue: -70
      maxvalue: 70
  - filter: Bounds Check
    filter variables:
    - name: aerosolOpticalDepth
      channels: *aodChannels
    minvalue: 0
    maxvalue: 4.9
    action:
      name: reject
  # observation error: sigma = max(0.05, 0.02 + 0.3*AOD), i.e. the Deep Blue pixel-level uncertainty slope
  # with a 0.05 floor (consistent with the OCI/polarimeter floor); then a 4-sigma gross-error check
  - filter: Perform Action
    filter variables:
    - name: aerosolOpticalDepth
      channels: *aodChannels
    action:
      name: assign error
      error function:
        name: ObsFunction/ObsErrorModelRamp
        options:
          xvar:
            name: ObsValue/aerosolOpticalDepth
            channels: *aodChannels
          x0: [0.1]
          x1: [1.0]
          err0: [0.05]
          err1: [0.32]
  - filter: Gaussian Thinning
    horizontal_mesh: {{RADTHINDISTANCE}}
    # select_mean (superobbing) stays OFF: plain 30-km Gaussian thinning, same as the other r4 suites
    action:
      name: reduce obs space
  # keep the missing-value flag below before any Background Check, whose applyFilter asserts on missing obs;
  # harmless without superobbing.
  - filter: Bounds Check
    filter variables:
    - name: aerosolOpticalDepth
      channels: 4
    minvalue: 0
    maxvalue: 4.9
    action:
      name: reject
  # ROUND FOUR (2026-10-05): background check matched to the OCI r4 plug (round three used reject 4 sigma,
  # inflate x3 at 3 sigma, which down-weights thick smoke whenever the background is low).
  # Now: reject only at 8 sigma, inflate x2 only beyond 5 sigma.
  - filter: Background Check
    filter variables:
    - name: aerosolOpticalDepth
      channels: *aodChannels
    threshold: 8.0
    action:
      name: reject
#  - filter: RejectList
#    defer to post: true
#    filter variables:
#    - name: aerosolOpticalDepth
#      channels: *aodChannels
  - filter: Background Check
    filter variables:
    - name: aerosolOpticalDepth
      channels: *aodChannels
    threshold: 5.0
    action:
      name: inflate error
      inflation factor: 2.0
