  obs filters:
  # AERONET Level 2.0 is a held-out reference: H(x) and O-B/O-A are produced, nothing is assimilated.
  - filter: PreQC
    maxvalue: 1
  - filter: Domain Check
    where:
    - variable:
        name: latitude@MetaData
      minvalue: -70
      maxvalue: 70
  - filter: Perform Action
    filter variables:
    - name: aerosolOpticalDepth
      channels: 1-8
    action:
      name: passivate
