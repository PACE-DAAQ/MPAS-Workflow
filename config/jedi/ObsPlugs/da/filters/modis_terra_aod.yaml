  obs filters:
  - filter: PreQC
    maxvalue: 1
  - filter: Domain Check
    where:
    - variable:
        name: latitude@MetaData
      minvalue: -60
      maxvalue: 70
  - filter: Bounds Check
    filter variables:
    - name: aerosolOpticalDepth
      channels: *aodChannels
    minvalue: 0
    maxvalue: 4.9
    action:
      name: reject
  - filter: Gaussian Thinning
    horizontal_mesh: {{RADTHINDISTANCE}}
    # select_mean (superobbing) OFF: it rejected 100% of superobs, 0 obs assimilated (2026-09-28)
    action:
      name: reduce obs space
  # gross-error check against the assigned error, before any inflation
  - filter: Background Check
    filter variables:
    - name: aerosolOpticalDepth
      channels: *aodChannels
    threshold: 4.0
    action:
      name: reject
#  - filter: RejectList
#    defer to post: true
#    filter variables:
#    - name: aerosolOpticalDepth
#      channels: *aodChannels
  # 3-sigma background check: inflate the obs error x3 where |O-B| > 3 sigma
  - filter: Background Check
    filter variables:
    - name: aerosolOpticalDepth
      channels: *aodChannels
    threshold: 3.0
    action:
      name: inflate error
      inflation factor: 3.0
