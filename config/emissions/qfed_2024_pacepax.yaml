# QFED v2.5.r1-geos-esm -> MPAS for the Aug-Sep 2024 PACE-PAX period.
#
# Why QFED rather than FINN for this period: FINNv2.5 NRT does not publish
# 2024-09-09..09-15 or 2024-09-26..09-30, and the first of those gaps is exactly
# the window that produced the smoke sampled by the PACE-PAX flights over the
# Line and Bridge fires. QFED has no gaps in the period -- all 30 September days
# are present upstream -- and resolves both fires with a physically coherent
# evolution (Line peaking 09-08, Bridge 09-10, both falling to zero by 09-17 as
# they were contained).
#
# FINN is still required alongside this file for two things QFED cannot supply:
#   * iso/mnt, which the archived QFED files do not carry (see the note below
#     and the FINN fallbacks in SetStreamsVariant.csh);
#   * PRM fire size, because the 2024 QFED emission suite is mass flux only and
#     the QFED FRP/fire-area ancillary product stops at 2023.
#
# Source layout differs from qfed.example.yaml: that file reads the archived
# *consolidated annual* file (92 daily records, Oct-Dec), whereas this period
# is staged as individual daily files pulled from the GEOS-Chem S3 mirror named
# by the nmmm0081 archive's own download.sh. The glob below therefore matches
# per-day files. Keep these in a directory that holds ONLY the daily files: a
# glob spanning both the dailies and a consolidated {year}.nc4 in the same
# directory would load each record twice.
inventory: QFED
year: 2024
source:
  # Product-specific source files are set under each output below.
  files: /glade/derecho/scratch/syha/gocart2g_aug2024/qfed/orig/qfed2.emis_bc.061.{year}????.nc4
  time: time
  latitude: [lat, latitude]
  longitude: [lon, longitude]

time:
  # One record per daily file, timestamped 12 UTC. Each is treated as the daily
  # mean for its calendar day and repeated to all 24 MPAS hours, matching the
  # consolidated-file behaviour in qfed.example.yaml.
  #
  # Range covers the free-forecast spin-up through the last PACE-PAX research
  # flight (RF0930). The two fires of interest are out by 09-17, so the tail is
  # spin-down only.
  start: "{year}-07-19T00:00:00"
  end: "{year}-09-30T23:00:00"
  target frequency: hourly
  target step hours: 1
  source temporal semantics: daily_mean
  # Only if a whole daily record is absent do we interpolate between days.
  # Verified 74/74 days staged for all five species, so this should not trigger;
  # it stays enabled so a single missing day degrades rather than aborts.
  missing: linear
  max interpolation gap days: 3
  allow extrapolation: false

outputs:
  - file: QFED_Glb_{year}_MPAS.{grid}.grid.bc.hourly.nc
    source files: /glade/derecho/scratch/syha/gocart2g_aug2024/qfed/orig/qfed2.emis_bc.061.{year}????.nc4
    fields:
      bc_biob_modis:
        source variable: biomass
        source units: kg m-2 s-1
        target units: molecules cm-2 s-1
        molecular weight g mol-1: 12.011
  - file: QFED_Glb_{year}_MPAS.{grid}.grid.oc.hourly.nc
    source files: /glade/derecho/scratch/syha/gocart2g_aug2024/qfed/orig/qfed2.emis_oc.061.{year}????.nc4
    fields:
      oc_biob_modis:
        source variable: biomass
        source units: kg m-2 s-1
        target units: molecules cm-2 s-1
        molecular weight g mol-1: 12.011
  - file: QFED_Glb_{year}_MPAS.{grid}.grid.nh3.hourly.nc
    source files: /glade/derecho/scratch/syha/gocart2g_aug2024/qfed/orig/qfed2.emis_nh3.061.{year}????.nc4
    fields:
      nh3_biob_modis:
        source variable: biomass
        source units: kg m-2 s-1
        target units: molecules cm-2 s-1
        molecular weight g mol-1: 17.031
  - file: QFED_Glb_{year}_MPAS.{grid}.grid.so2.hourly.nc
    source files: /glade/derecho/scratch/syha/gocart2g_aug2024/qfed/orig/qfed2.emis_so2.061.{year}????.nc4
    fields:
      so2_biob_modis:
        source variable: biomass
        source units: kg m-2 s-1
        target units: molecules cm-2 s-1
        molecular weight g mol-1: 64.066
  - file: QFED_Glb_{year}_MPAS.{grid}.grid.co.hourly.nc
    source files: /glade/derecho/scratch/syha/gocart2g_aug2024/qfed/orig/qfed2.emis_co.061.{year}????.nc4
    fields:
      co_biob_modis:
        source variable: biomass
        source units: kg m-2 s-1
        target units: molecules cm-2 s-1
        molecular weight g mol-1: 28.0101
# ISO/MNT intentionally remain FINN fallbacks in SetStreamsVariant.csh because
# the archived QFED files do not provide those two MPAS species.

scaling:
  default: 1.0
  species:
    nh3: 1.0
