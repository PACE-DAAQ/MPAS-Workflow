# NOAA GBBEPx blended biomass burning -> MPAS.
#
# GBBEPx blends VIIRS and MODIS FRP through NOAA's own algorithm, so it is an
# estimate independent of the retrieval chain GFAS assimilates -- useful as a
# third biomass member when building emission ensembles.
#
# Copy this file, pin the version in the source glob, and set the interval to
# the days actually present in the archive.  config/emissions/gbbepx_2024_pacepax.yaml
# is a worked example for Jul-Sep 2024.
inventory: GBBEPx
year: 2024
source:
  # Pin the processing version. The OSPO archive switches v4r0 -> v5r0 during
  # 2024-05, and a glob that spans the switch can silently mix two versions of
  # the same day.
  files:
    - /glade/path/to/gbbepx/GBBEPx-all01GRID_v5r0_blend_s{year}*.nc
  time: Time
  latitude: [Latitude, lat]
  longitude: [Longitude, lon]

time:
  # One record per daily file, at 12 UTC ("days since <date> 12:00:00"), so the
  # record already sits mid-day and needs no offset -- unlike native GFAS.
  # Each is treated as the daily mean and repeated to all 24 MPAS hours.
  start: "{year}-01-01T00:00:00"
  end: "{year}-12-31T23:00:00"
  target frequency: hourly
  target step hours: 1
  source temporal semantics: daily_mean
  missing: linear
  max interpolation gap days: 3
  allow extrapolation: false

# Grid note: GBBEPx is 1801 x 3600 (node-centred, -90..90 inclusive), while GFAS
# and QFED are 1800 x 3600 (cell-centred).  It therefore gets its own gridspec
# and conservative weights (weights_1801x3600_to_x1.163842.nc); a QFED or GFAS
# weight file is not interchangeable with it and will be rejected if supplied.
#
# Source units are written transposed as "kg s-1 m-2" in the files themselves;
# declare them here in either spelling.
outputs:
  - file: GBBEPx_Glb_{year}_MPAS.{grid}.grid.bc.hourly.nc
    fields:
      bc_biob_modis:
        source variable: BC
        source units: kg m-2 s-1
        target units: molecules cm-2 s-1
        molecular weight g mol-1: 12.011
  - file: GBBEPx_Glb_{year}_MPAS.{grid}.grid.oc.hourly.nc
    fields:
      oc_biob_modis:
        source variable: OC
        source units: kg m-2 s-1
        target units: molecules cm-2 s-1
        molecular weight g mol-1: 12.011
  - file: GBBEPx_Glb_{year}_MPAS.{grid}.grid.nh3.hourly.nc
    fields:
      nh3_biob_modis:
        source variable: NH3
        source units: kg m-2 s-1
        target units: molecules cm-2 s-1
        molecular weight g mol-1: 17.031
  - file: GBBEPx_Glb_{year}_MPAS.{grid}.grid.so2.hourly.nc
    fields:
      so2_biob_modis:
        source variable: SO2
        source units: kg m-2 s-1
        target units: molecules cm-2 s-1
        molecular weight g mol-1: 64.066
  - file: GBBEPx_Glb_{year}_MPAS.{grid}.grid.co.hourly.nc
    fields:
      co_biob_modis:
        source variable: CO
        source units: kg m-2 s-1
        target units: molecules cm-2 s-1
        molecular weight g mol-1: 28.0101
# CO2, NOx and PM2.5 are present in the source but are not GOCART2G biomass
# streams, so they are deliberately not written.  MeanFRP is gridded FRP, not a
# per-fire mean area, so GBBEPx cannot supply the PRM fire-size product: a
# GBBEPx member still needs `prm source: finn`.

scaling:
  default: 1.0
