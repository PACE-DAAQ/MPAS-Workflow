model:
  # GOCART emission inventories for the forecast streams.atmosphere.
  # 'streams variant' selects a default (anthropogenic / biogenic / biomass-burning) combination;
  # the variant -> combination mapping and the inventory -> filename tables live in
  # bin/SetStreamsVariant.csh (edit there to add combinations or inventories).
  #   streams variant: cntl | pert01..pert08   (default cntl = cams / cams / finn)
  # Optionally override a single dimension (empty = use the variant's default):
  #   anth emissions: cams | ceds | cams-mix
  #   biob emissions: finn | gfas | qfed
  #   biog emissions: cams
  resources:
    #{{mesh}}:
    #  meshRatio: 1 for uniform meshes
    #  nCells: float
    #    number of horizontal cells for each valid mesh descriptor
    #    serves as a convenience for file naming when distinguishing between
    #    multiple meshes, but does not affect any calculations
    #  TimeStep: float # only used for {{outerMesh}}
    #  DiffusionLengthScale: float # only used for {{outerMesh}}
    #  RadiationLWInterval: hh:mm:ss
    #  RadiationSWInterval: hh:mm:ss
    #  PhysicsSuite: str
    #  Microphysics: str
    #  Convection: str
    #  PBL: str
    #  Gwdo: str inside quotation marks
    #  RadiationCloud: str
    #  RadiationLW: str
    #  RadiationSW: str
    #  SfcLayer: str
    #  LSM: str
    60-3km:
      meshRatio: 20
      nCells: 835586
      TimeStep: 20.0
      DiffusionLengthScale: 3000.0
      RadiationLWInterval: 00:03:00
      RadiationSWInterval: 00:03:00
      PhysicsSuite: convection_permitting
      Microphysics: mp_thompson
      Convection: cu_ntiedtke
      PBL: bl_mynn
      Gwdo: bl_ysu_gwdo
      RadiationCloud: cld_fraction_thompson
      RadiationLW: rrtmg_lw
      RadiationSW: rrtmg_sw
      SfcLayer: sf_mynn
      LSM: sf_noah
    30km:
      meshRatio: 1
      nCells: 655362
      TimeStep: 180.0
      DiffusionLengthScale: 30000.0
      RadiationLWInterval: 00:30:00
      RadiationSWInterval: 00:30:00
      PhysicsSuite: mesoscale_reference
      Microphysics: mp_wsm6
      Convection: cu_ntiedtke
      PBL: bl_ysu
      Gwdo: bl_ysu_gwdo
      RadiationCloud: cld_fraction
      RadiationLW: rrtmg_lw
      RadiationSW: rrtmg_sw
      SfcLayer: sf_monin_obukhov_rev
      LSM: sf_noah
    60km: # for gocartMPAS
      meshRatio: 1
      nCells: 163842
      TimeStep: 360.0
      DiffusionLengthScale: 60000.0
      RadiationLWInterval: 00:30:00
      RadiationSWInterval: 00:30:00
      PhysicsSuite: MPAS-GOCART2G 
      Microphysics: mp_thompson_gocart2G
      Convection: cu_ntiedtke
      PBL: bl_mynn
      Gwdo: bl_ysu_gwdo
      RadiationCloud: cld_fraction
      RadiationLW: rrtmg_lw
      RadiationSW: rrtmg_sw
      SfcLayer: sf_mynn
      #LSM: sf_noahmp
      LSM: sf_noah
    120km:
      meshRatio: 1
      nCells: 40962
      TimeStep: 720.0
      DiffusionLengthScale: 120000.0
      RadiationLWInterval: 00:30:00
      RadiationSWInterval: 00:30:00
      PhysicsSuite: mesoscale_reference
      Microphysics: mp_wsm6
      Convection: cu_ntiedtke
      PBL: bl_ysu
      Gwdo: bl_ysu_gwdo
      RadiationCloud: cld_fraction
      RadiationLW: rrtmg_lw
      RadiationSW: rrtmg_sw
      SfcLayer: sf_monin_obukhov_rev
      LSM: sf_noah
