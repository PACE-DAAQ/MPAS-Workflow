initic:
## mesh-specific settings
  # resource requirements
  job:
    #{{outerMesh}}:
    #  seconds: int
    #  nodes: int
    #  PEPerNode: int
    defaults:
      seconds: 600
      nodes: 1
      PEPerNode: 128

      # cylc retry string
      retry: '0*PT30S'

    60-3km:
      seconds: 320
      nodes: 2
      PEPerNode: 128
    30km:
      seconds: 320
      nodes: 2
      PEPerNode: 128
    60km:
      seconds: 160
      nodes: 1
      PEPerNode: 128
    120km:
      seconds: 120
      nodes: 1
      PEPerNode: 128

  # Optional source-first GOCART2G cold-start chemistry initialization.
  # off      : preserve existing meteorology-only init_atmosphere behavior.
  # prebuilt : read MERRA2:* intermediates from chemistry prebuilt directory.
  # workflow : PrepareChemIC starts from raw MERRA2/GMI resources using
  #            config/chemistry/merra2_source.example.yaml.
  chemistry mode: off
  chemistry source config: ''
  chemistry processor directory: ''
  chemistry work directory: 'ChemIC/{{thisValidDate}}'
  chemistry prebuilt directory: ''
  # Empty => Build.gocart background lut directory; may be set to the ACOM
  # campaign BACKGROUND holding documented by MPAS-GOCART2G Instructions.
  chemistry background directory: ''
